# NexusOS Configuration
# /etc/nexus/nexus.conf

[system]
hostname = "nexus-workstation"
role = "workstation"  # "workstation" | "server" | "edge"
auto_update = true
log_level = "info"  # "debug" | "info" | "warn" | "error"
data_dir = "/var/lib/nexus"

[agents]
max_concurrent = 8
default_model = "claude-sonnet-4-6"
mcp_socket_path = "/run/nexus/mcp.sock"
sandbox_mode = "strict"  # "strict" | "permissive" | "off"
task_timeout_seconds = 300
hotl_window_seconds = 300  # Human-on-the-Loop kill-switch window
auto_escalate_below_confidence = 0.7

[identity]
provider = "nexus"  # "nexus" | "entra" | "hybrid"
domain = "nexus.local"
realm = "NEXUS"
sync_interval_seconds = 60
# Entra ID settings (when provider = "entra" or "hybrid")
entra_tenant_id = ""
entra_client_id = ""
entra_authority = "https://login.microsoftonline.com"

[credits]
billing_mode = "local"  # "local" | "cloud" | "enterprise"
max_credits_per_agent = 1000
credit_refresh_interval = "monthly"
audit_log_path = "/var/log/nexus/credits.log"
ledger_db_path = "/var/lib/nexus/credits.sqlite"

[security]
require_agent_signing = true
max_privilege_level = 3  # 1=read-only, 2=read-write, 3=execute, 4=admin
audit_level = "full"  # "minimal" | "standard" | "full"
agent_cert_dir = "/etc/nexus/certs"
enable_bias_audits = true
bias_audit_schedule = "weekly"

[dashboard]
enabled = true
bind_address = "127.0.0.1"
port = 9500
# Fish Tank spatial computing dashboard
fishtank_mode = false  # Enable VR/AR spatial interface
